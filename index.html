    <meta property="og:description" content="سامانه جامع و اختصاصی مدیریت آکادمی شکوه دانش (shoukoh danesh)" />
    <title>سامانه مدیریت آکادمی شکوه دانش</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Suppress harmless Vite dev WebSocket/HMR reconnection errors in AI Studio iframe
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('@vite/client') ||
          event.message.includes('createWebSocketModuleRunnerTransport')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason && (event.reason.message || String(event.reason));
        if (reason && (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
